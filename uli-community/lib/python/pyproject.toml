[project]
name = "project"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "feluda==0.9.4",
    "feluda-vid-vec-rep-clip==0.1.4",
    "feluda-cluster-embeddings==0.1.4",
    "ruff==0.11.11",
    "sentence-transformers==4.1.0",
    "torch>=2.13,<3.0",
    "torchvision>=0.28,<1.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

torchvision = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
